version: '3.8'

services:
  # Dual Exchange LIVE Trading (Upbit routed long + Binance gated short)
  paper-trading:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitcoin-dual-paper-trading
    restart: unless-stopped
    user: root
    env_file:
      - .env
    volumes:
      # 로그 디렉토리
      - ./logs:/app/logs
      # DB 파일 (읽기 전용)
      - ./upbit_bitcoin.db:/app/upbit_bitcoin.db:ro
      # V35 전략 설정 파일
      - ./strategies/v35_optimized/config_optimized.json:/app/strategies/v35_optimized/config_optimized.json:ro
      # SHORT_V1 전략 설정 파일
      - ./strategies/SHORT_V1/config_optimized.json:/app/strategies/SHORT_V1/config_optimized.json:ro
      # SHORT_V1 데이터 파일
      - ./strategies/SHORT_V1/results:/app/strategies/SHORT_V1/results:ro
      # 거래 결과 DB
      - ./trading_results.db:/app/trading_results.db
      # 선택된 운영 candidate 설정 (tuned)
      - ./analysis/selected_candidate.json:/app/analysis/selected_candidate.json:ro
    environment:
      - TZ=Asia/Seoul
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PAPER_TRADING=false
      - ENABLE_LIVE_TRADING=1
    command: python live_trading/dual_paper_trading.py --mode live --upbit-capital 10000000 --binance-capital 10000 --interval 60 --telegram-commands --candidate-json /app/analysis/selected_candidate.json
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # 웹 대시보드 (모니터링) - 향후 구현 예정
