<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Asset Trading Bot - Live Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Multi-Asset Trading Bot</h1>
            <div class="header-info">
                <span class="engine-mode" id="engine-mode">-</span>
                <span class="last-update">Last update: <span id="last-update-time">-</span></span>
                <span class="kill-switch">
                    <span id="kill-switch-indicator" class="indicator off"></span>
                    <span id="kill-switch-text">Checking...</span>
                </span>
            </div>
        </header>

        <!-- Portfolio Summary Section -->
        <section class="portfolio-section">
            <div class="portfolio-summary">
                <div class="portfolio-stat">
                    <span class="label">Total Capital</span>
                    <span id="total-capital" class="value">-</span>
                </div>
                <div class="portfolio-stat">
                    <span class="label">Total Value</span>
                    <span id="total-value" class="value">-</span>
                </div>
                <div class="portfolio-stat">
                    <span class="label">Exposure</span>
                    <span id="exposure-pct" class="value">-</span>
                </div>
                <div class="portfolio-stat">
                    <span class="label">Unrealized P&L</span>
                    <span id="unrealized-pnl" class="value">-</span>
                </div>
                <div class="portfolio-stat">
                    <span class="label">Iterations</span>
                    <span id="iteration-count" class="value">-</span>
                </div>
            </div>
        </section>

        <!-- Assets Grid -->
        <section class="assets-section">
            <h2>Assets</h2>
            <div id="assets-grid" class="assets-grid">
                <!-- Asset cards will be dynamically generated here -->
                <p class="loading">Loading assets...</p>
            </div>
        </section>

        <!-- Premium Overview Section -->
        <section class="premium-section">
            <h2>Kimchi Premium</h2>
            <div id="premium-grid" class="premium-grid">
                <!-- Premium cards will be dynamically generated here -->
                <p class="loading">Loading premium data...</p>
            </div>
        </section>

        <!-- Hedge Status Section -->
        <section class="hedge-section">
            <h2>Hedge Status</h2>
            <div class="hedge-summary">
                <div class="hedge-stat">
                    <span class="label">Hedgeable Assets</span>
                    <span id="hedge-symbols" class="value">-</span>
                </div>
                <div class="hedge-stat">
                    <span class="label">Capital (USDT)</span>
                    <span id="hedge-capital" class="value">-</span>
                </div>
            </div>
            <div id="delta-grid" class="delta-grid">
                <!-- Delta states will be dynamically generated here -->
            </div>
        </section>

        <footer>
            <p>Auto-refresh every 30 seconds</p>
        </footer>
    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
