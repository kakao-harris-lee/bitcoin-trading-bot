<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Lab - Job Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div x-data="jobMonitor()" x-init="init()" class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400">Job Monitor</h1>
            <div class="space-x-4">
                <a href="/quant-lab/" class="text-gray-400 hover:text-white">New Experiment</a>
                <a href="/" class="text-gray-400 hover:text-white">Dashboard</a>
            </div>
        </div>

        <!-- Active Jobs -->
        <div class="bg-gray-800 rounded-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Active Jobs</h2>
            <div x-show="activeJobs.length === 0" class="text-gray-500 text-center py-8">
                No active jobs. <a href="/quant-lab/" class="text-blue-400 hover:underline">Start an experiment</a>
            </div>
            <template x-for="job in activeJobs" :key="job.job_id || job.study_name">
                <div class="border border-gray-700 rounded-lg p-4 mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-semibold" x-text="job.study_name"></h3>
                        <span :class="statusClass(job.status)" class="px-2 py-1 rounded text-sm"
                              x-text="job.status"></span>
                    </div>
                    <div x-show="job.status === 'running'" class="mb-4">
                        <div class="flex justify-between text-sm text-gray-400 mb-1">
                            <span>Progress</span>
                            <span x-text="job.current_trial + '/' + (job.max_trials || '?')"></span>
                        </div>
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-blue-600 h-2 rounded-full transition-all"
                                 :style="'width: ' + (job.current_trial / (job.max_trials || 500) * 100) + '%'"></div>
                        </div>
                    </div>
                    <div x-show="job.status === 'queued'" class="mb-4 text-sm text-gray-400">
                        Waiting in queue
                    </div>
                    <div x-show="job.status === 'failed'" class="mb-4 text-sm text-red-300 break-all">
                        <span class="font-semibold">Error:</span>
                        <span x-text="job.error || 'Unknown failure'"></span>
                    </div>
                    <div class="flex space-x-4 text-sm">
                        <a :href="'/quant-lab/results/' + job.study_name"
                           class="text-blue-400 hover:underline">View Results</a>
                        <button @click="cancelJob(job.job_id)" x-show="job.status === 'running'"
                                class="text-red-400 hover:underline">Cancel</button>
                    </div>
                </div>
            </template>
        </div>

        <!-- Completed Experiments -->
        <div class="bg-gray-800 rounded-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Completed Experiments</h2>
            <table class="w-full">
                <thead>
                    <tr class="text-left text-gray-400 border-b border-gray-700">
                        <th class="pb-2">Name</th>
                        <th class="pb-2">Trials</th>
                        <th class="pb-2">Pareto Size</th>
                        <th class="pb-2">Date</th>
                        <th class="pb-2">Status</th>
                        <th class="pb-2">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="exp in completedExperiments" :key="exp.job_id || exp.study_name">
                        <tr class="border-b border-gray-700">
                            <td class="py-3" x-text="exp.study_name || '(unnamed)'"></td>
                            <td class="py-3" x-text="exp.n_trials ?? '-'"></td>
                            <td class="py-3" x-text="exp.pareto_size ?? '-'"></td>
                            <td class="py-3" x-text="formatDate(exp.datetime_start)"></td>
                            <td class="py-3">
                                <span :class="statusClass(exp.status || 'completed')" class="px-2 py-1 rounded text-xs"
                                      x-text="exp.status || 'completed'"></span>
                            </td>
                            <td class="py-3">
                                <a :href="'/quant-lab/results/' + exp.study_name"
                                   x-show="exp.study_name"
                                   class="text-blue-400 hover:underline">View</a>
                                <span x-show="!exp.study_name" class="text-gray-500">N/A</span>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function jobMonitor() {
            return {
                activeJobs: [],
                completedExperiments: [],
                completedJobs: [],
                activePollInterval: null,
                experimentsPollInterval: null,
                activeRequestInFlight: false,
                experimentsRequestInFlight: false,

                async init() {
                    await this.loadActiveJobs();
                    await this.loadCompletedExperiments();
                    this.activePollInterval = setInterval(() => this.loadActiveJobs(), 5000);
                    this.experimentsPollInterval = setInterval(() => this.loadCompletedExperiments(), 30000);
                },

                async fetchJson(url, timeoutMs = 8000) {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), timeoutMs);
                    try {
                        const res = await fetch(url, { signal: controller.signal });
                        const data = await res.json();
                        if (!res.ok) {
                            throw new Error(data.error || `HTTP ${res.status}`);
                        }
                        return data;
                    } finally {
                        clearTimeout(timeout);
                    }
                },

                async loadActiveJobs() {
                    if (this.activeRequestInFlight) return;
                    this.activeRequestInFlight = true;
                    try {
                        const activeData = await this.fetchJson('/quant-lab/api/active-jobs', 5000);
                        this.activeJobs = activeData.active_jobs || [];
                        this.completedJobs = activeData.completed_jobs || [];
                    } catch (e) {
                        console.error('Failed to load active jobs:', e);
                    } finally {
                        this.activeRequestInFlight = false;
                    }
                },

                async loadCompletedExperiments() {
                    if (this.experimentsRequestInFlight) return;
                    this.experimentsRequestInFlight = true;
                    try {
                        const activeNames = new Set(this.activeJobs.map(j => j.study_name));
                        const data = await this.fetchJson('/quant-lab/api/experiments', 10000);
                        const completedFromStudies = (data.experiments || [])
                            .filter(exp => !activeNames.has(exp.study_name));
                        const completedFromJobs = (this.completedJobs || []).map(job => ({
                            job_id: job.job_id,
                            study_name: job.study_name,
                            n_trials: job.current_trial ?? '-',
                            pareto_size: job.pareto_size ?? '-',
                            datetime_start: job.updated_at || job.datetime_start || null,
                            status: job.status || 'completed',
                        }));
                        const seen = new Set();
                        this.completedExperiments = [...completedFromJobs, ...completedFromStudies]
                            .filter((exp) => {
                                const key = exp.job_id || exp.study_name;
                                if (!key || seen.has(key)) return false;
                                seen.add(key);
                                return true;
                            });
                    } catch (e) {
                        console.error('Failed to load completed experiments:', e);
                    } finally {
                        this.experimentsRequestInFlight = false;
                    }
                },

                statusClass(status) {
                    return {
                        'running': 'bg-blue-900 text-blue-300',
                        'completed': 'bg-green-900 text-green-300',
                        'failed': 'bg-red-900 text-red-300',
                        'pending': 'bg-yellow-900 text-yellow-300',
                        'queued': 'bg-yellow-900 text-yellow-300',
                    }[status] || 'bg-gray-700';
                },

                formatDate(isoStr) {
                    if (!isoStr) return '-';
                    return new Date(isoStr).toLocaleDateString();
                },

                async cancelJob(jobId) {
                    if (!confirm('Cancel this job?')) return;
                    // TODO: Implement job cancellation
                    alert('Job cancellation not yet implemented');
                },
            };
        }
    </script>
</body>
</html>
